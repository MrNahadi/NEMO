[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-marine-optimizer"
version = "0.1.0"
description = "Multi-part, code-generated marine structural optimizer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "plotly>=5.18",
  "streamlit>=1.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4"
]

[project.scripts]
nemo = "nemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nemo.parts.definitions" = ["*.json"]
